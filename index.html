<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Pretendard', sans-serif;
  background:
    radial-gradient(circle at 10% 10%, #e6edff, transparent 35%),
    radial-gradient(circle at 90% 90%, #e4f2ff, transparent 35%),
    #f6f8fd;
  color: #27344c;
  min-height: 100vh;
  padding: 25px;
}

.container {
  max-width: 1150px;
  margin: auto;
  background: rgba(255,255,255,0.94);
  border-radius: 25px;
  padding: 30px 42px;
  box-shadow: 0 12px 45px rgba(70,90,140,0.08);
}

/* HEADER */

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 45px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: 800;
}

.logo-icon {
  width: 38px;
  height: 38px;
  background: #5279ed;
  color: white;
  border-radius: 12px;
  display: grid;
  place-items: center;
}

.tag {
  background: #f0f3fa;
  padding: 9px 15px;
  border-radius: 20px;
  font-size: 11px;
  color: #65738c;
  font-weight: 700;
}

/* HERO */

.hero {
  text-align: center;
  margin-bottom: 38px;
}

.eyebrow {
  color: #5279ed;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.5px;
  margin-bottom: 15px;
}

.hero h1 {
  font-size: clamp(27px, 4vw, 40px);
  line-height: 1.3;
  letter-spacing: -1.5px;
  margin-bottom: 13px;
}

.hero h1 span {
  color: #5279ed;
}

.hero p {
  color: #8995a8;
  font-size: 14px;
  line-height: 1.8;
}

/* CARDS */

.section-heading {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 15px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 30px;
}

.card {
  background: white;
  border: 1px solid #edf0f6;
  border-radius: 17px;
  padding: 22px;
  min-height: 145px;
  transition: .2s;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(70,90,140,.08);
  border-color: #dce5ff;
}

.card-icon {
  width: 40px;
  height: 40px;
  background: #edf2ff;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 19px;
  margin-bottom: 15px;
}

.card h3 {
  font-size: 15px;
  margin-bottom: 8px;
}

.card p {
  color: #8995a8;
  font-size: 12px;
  line-height: 1.7;
}

/* AI CHAT */

.chat-box {
  background: #f8faff;
  border: 1px solid #e9eef9;
  border-radius: 19px;
  padding: 18px;
}

.chat-header {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 15px;
}

.bot-icon {
  width: 38px;
  height: 38px;
  background: #e6edff;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 19px;
}

.chat-title h2 {
  font-size: 15px;
  margin-bottom: 4px;
}

.chat-title p {
  font-size: 11px;
  color: #929eb1;
}

.status {
  margin-left: auto;
  color: #36ad83;
  font-size: 11px;
}

.status::before {
  content: '';
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #36c28e;
  margin-right: 5px;
}

.chat-guide {
  background: white;
  border-radius: 11px;
  padding: 12px 15px;
  font-size: 12px;
  color: #718099;
  line-height: 1.7;
  margin-bottom: 13px;
}

/* IFRAME */

.iframe-wrapper {
  width: 100%;
  height: 530px;
  background: white;
  border: 1px solid #edf0f6;
  border-radius: 13px;
  overflow: hidden;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* FOOTER */

footer {
  text-align: center;
  font-size: 11px;
  color: #a1adbd;
  margin-top: 22px;
}

/* MOBILE */

@media (max-width: 700px) {
  body {
    padding: 10px;
  }

  .container {
    padding: 23px 16px;
    border-radius: 19px;
  }

  header {
    margin-bottom: 38px;
  }

  .cards {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .card {
    min-height: auto;
    padding: 17px;
  }

  .card-icon {
    margin-bottom: 10px;
  }

  .hero {
    margin-bottom: 28px;
  }

  .iframe-wrapper {
    height: 520px;
  }

  .chat-box {
    padding: 12px;
  }
}
</style>
</head>

<body>
